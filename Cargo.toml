[workspace]
resolver = "3"
members = ["hello-world"]

[workspace.package]
version = "0.1.0"
authors = ["thinkgo <thinkgo@aliyun.com>"]
edition = "2024"
rust-version = "1.96"
description = "learn gpui"
keywords = ["gpui"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/thinkgos/learn-gpui"
repository = "https://github.com/thinkgos/learn-gpui"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "wayland",
  "x11",
] }
